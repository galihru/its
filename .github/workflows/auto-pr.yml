name: Auto Open Codex PR

on:
  push:
    branches: ["codex/**"]
  workflow_dispatch:
    inputs:
      head_branch:
        description: "Branch to open as PR head"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      REQUESTED_TARGET_REPO: ${{ vars.AUTO_PR_TARGET_REPO || 'hanifasepthi/its' }}
      TARGET_BASE: ${{ vars.AUTO_PR_BASE_BRANCH || 'main' }}
      HEAD_OWNER: ${{ github.repository_owner }}
      HEAD_BRANCH: ${{ inputs.head_branch || github.ref_name }}
      AUTO_MERGE: ${{ vars.AUTO_PR_ENABLE_AUTOMERGE || 'false' }}
      HAS_AUTO_PR_TOKEN: ${{ secrets.AUTO_PR_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update pull request
        shell: bash
        run: |
          set -euo pipefail

          target_repo="$REQUESTED_TARGET_REPO"
          head_ref="${HEAD_OWNER}:${HEAD_BRANCH}"
          if [[ "$target_repo" != "$GITHUB_REPOSITORY" && "$HAS_AUTO_PR_TOKEN" != "true" ]]; then
            echo "::warning::AUTO_PR_TARGET_REPO points to ${target_repo}, but AUTO_PR_TOKEN is not configured. Falling back to ${GITHUB_REPOSITORY}. Add an AUTO_PR_TOKEN secret to open upstream PRs automatically."
            target_repo="$GITHUB_REPOSITORY"
            head_ref="$HEAD_BRANCH"
          fi

          title="[codex] ${HEAD_BRANCH#codex/}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## Ringkasan
          - Membuka pull request otomatis dari branch \`${head_ref}\`.
          - Target: \`${target_repo}:${TARGET_BASE}\`.
          - Title dan deskripsi dibuat oleh workflow agar tidak perlu lewat halaman compare GitHub.

          ## Validasi
          - Workflow ini hanya membuat atau memperbarui PR.
          - Build/test tetap mengikuti workflow lain di repository.

          ## Auto-merge
          Auto-merge hanya dijalankan jika repository mengaktifkan variable \`AUTO_PR_ENABLE_AUTOMERGE=true\` dan aturan branch GitHub mengizinkan auto-merge.
          EOF

          pr_error="$(mktemp)"
          if ! existing="$(gh pr list \
            --repo "$target_repo" \
            --head "$head_ref" \
            --base "$TARGET_BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty' 2>"$pr_error")"; then
            cat "$pr_error"
            echo "::warning::GitHub token cannot list pull requests for ${target_repo}. Enable 'Allow GitHub Actions to create and approve pull requests' or add AUTO_PR_TOKEN with pull request write access."
            echo "Manual compare URL: https://github.com/${target_repo}/compare/${TARGET_BASE}...${head_ref}?expand=1"
            exit 0
          fi

          if [[ -n "$existing" ]]; then
            if ! gh pr edit "$existing" \
              --repo "$target_repo" \
              --title "$title" \
              --body-file "$body_file" 2>"$pr_error"; then
              cat "$pr_error"
              echo "::warning::PR #${existing} exists, but this token cannot edit it."
              exit 0
            fi
            pr_url="$(gh pr view "$existing" --repo "$target_repo" --json url --jq '.url')"
            echo "Updated PR: $pr_url"
          else
            if ! pr_url="$(gh pr create \
              --repo "$target_repo" \
              --base "$TARGET_BASE" \
              --head "$head_ref" \
              --title "$title" \
              --body-file "$body_file" 2>"$pr_error")"; then
              cat "$pr_error"
              echo "::warning::Automatic PR creation is blocked by repository permissions. Enable 'Allow GitHub Actions to create and approve pull requests' or add AUTO_PR_TOKEN. Compare URL: https://github.com/${target_repo}/compare/${TARGET_BASE}...${head_ref}?expand=1"
              exit 0
            fi
            echo "Created PR: $pr_url"
          fi

          if [[ "$AUTO_MERGE" == "true" ]]; then
            if ! gh pr merge "$pr_url" --repo "$target_repo" --squash --auto --delete-branch=false 2>"$pr_error"; then
              cat "$pr_error"
              echo "::warning::Auto-merge was requested but could not be enabled. Check branch protection and token permissions."
              exit 0
            fi
            echo "Auto-merge requested for: $pr_url"
          fi

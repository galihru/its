name: Build Android APK

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set APK version
        run: |
          set -euo pipefail
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          APK_FILE_NAME="its-${VERSION_NAME}-${VERSION_CODE}.apk"
          {
            echo "ITS_VERSION_CODE=${VERSION_CODE}"
            echo "ITS_VERSION_NAME=${VERSION_NAME}"
            echo "VITE_APP_VERSION=${VERSION_NAME}"
            echo "VITE_APP_VERSION_CODE=${VERSION_CODE}"
            echo "APK_FILE_NAME=${APK_FILE_NAME}"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: web
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android debug APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint

      - name: Prepare APK artifact
        id: apk
        run: |
          set -euo pipefail
          APK_SRC="web/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="web/dist/apk/${APK_FILE_NAME}"
          APK_LATEST="web/dist/apk/its-latest.apk"
          test -f "$APK_SRC"
          mkdir -p web/dist/apk
          cp "$APK_SRC" "$APK_OUT"
          cp "$APK_SRC" "$APK_LATEST"
          node web/scripts/write-apk-manifest.mjs
          echo "path=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "latest_path=$APK_LATEST" >> "$GITHUB_OUTPUT"
          echo "manifest=web/dist/app-update.json" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK_OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: its-debug-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.latest_path }}
            ${{ steps.apk.outputs.manifest }}

      - name: Publish APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.manifest }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ITSTELKOM }}

      - name: Deploy APK to Firebase
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase deploy --project itstelkom --only hosting --non-interactive
          ./node_modules/.bin/firebase database:set /apk dist/app-update.json --project itstelkom -y

      - name: Summary
        run: |
          echo "Version: ${ITS_VERSION_NAME} (${ITS_VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: ${{ steps.apk.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase: https://itstelkom.web.app/apk/its-latest.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: ${{ steps.apk.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"

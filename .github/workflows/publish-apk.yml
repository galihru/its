name: Build Android APK

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: web
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android debug APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint

      - name: Prepare APK artifact
        id: apk
        run: |
          set -euo pipefail
          APK_SRC="web/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="web/android/app/build/outputs/apk/debug/its-debug.apk"
          test -f "$APK_SRC"
          cp "$APK_SRC" "$APK_OUT"
          echo "path=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK_OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: its-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}

      - name: Summary
        run: |
          echo "APK: ${{ steps.apk.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: ${{ steps.apk.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"

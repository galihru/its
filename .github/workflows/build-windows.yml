name: Build Windows EXE

on:
  push:
    branches: ["main", "codex/**"]
    tags: ["its-maps-v*"]
    paths:
      - "web/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Read package version
        working-directory: web
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build custom Windows installer
        working-directory: web
        shell: pwsh
        run: npm run desktop:custom-installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ITS-Maps-Windows-Setup-${{ env.VERSION }}-x64
          if-no-files-found: error
          path: web/release/ITS-Maps-Windows-Custom-Setup-${{ env.VERSION }}-x64.exe

      - name: Publish Windows release asset
        if: startsWith(github.ref, 'refs/tags/its-maps-v')
        working-directory: web
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release\ITS-Maps-Windows-Custom-Setup-$env:VERSION-x64.exe"
          $notes = "ITS Maps $env:VERSION Windows custom setup. Installer besar disimpan di GitHub Release agar Firebase Hosting tidak penuh."
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --title "ITS Maps $env:VERSION" --notes $notes
          }

<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITS Maps | Raspberry Pi Live Traffic</title>
  <meta name="description"
    content="Dashboard maps ITS yang polling JSON realtime untuk Raspberry Pi controller, traffic, dan kamera." />
  <meta name="theme-color" content="#ffffff" />
  <link id="pwa-manifest" rel="manifest" href="/manifest.webmanifest" />
  <script>
    (() => {
      const link = document.getElementById("pwa-manifest");
      if (!link) return;
      const isMobilePwa = window.matchMedia("(max-width: 720px), (pointer: coarse)").matches;
      link.setAttribute("href", isMobilePwa ? "/manifest-mobile.webmanifest" : "/manifest-desktop.webmanifest");
    })();
  </script>
  <link rel="canonical" href="https://itstelkom.web.app/" />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="ITS Maps, Raspberry Pi, live traffic, peta, lalu lintas, dashboard, kamera" />
  <meta name="author" content="ITS Maps" />
  <!-- Open Graph / Social -->
  <meta property="og:site_name" content="ITS Maps" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ITS Maps | Raspberry Pi Live Traffic" />
  <meta property="og:description"
    content="Dashboard peta ITS yang polling JSON realtime untuk Raspberry Pi controller, traffic, dan kamera." />
  <meta property="og:url" content="./index.html" />
  <meta property="og:image" content="/screenshots/desktop-home.png" />
  <meta property="og:image:alt" content="ITS Maps preview" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ITS Maps | Raspberry Pi Live Traffic" />
  <meta name="twitter:description"
    content="Dashboard peta ITS yang polling JSON realtime untuk Raspberry Pi controller, traffic, dan kamera." />
  <meta name="twitter:image" content="/screenshots/desktop-home.png" />
  <!-- Apple / Windows -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="ITS Maps" />
  <meta name="msapplication-TileColor" content="#ffffff" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <!-- Structured data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ITS Maps",
    "url": "/",
    "description": "Dashboard peta ITS yang polling JSON realtime untuk Raspberry Pi controller, traffic, dan kamera."
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>

</html>

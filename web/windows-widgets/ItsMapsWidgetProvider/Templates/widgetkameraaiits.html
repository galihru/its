<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Kamera AI ITS — Widget</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg: #0b0f14;
            --panel: #111826;
            --panel-2: #161f30;
            --line: #243044;
            --accent: #19e3a3;
            --blue: #4d8dff;
            --amber: #ffb020;
            --danger: #ff5470;
            --text: #e9eef5;
            --text-dim: #8a94a6;
            --text-faint: #5c6578;
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #05070a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 12px;
            font-family: var(--font-ui);
            color: var(--text);
            min-height: 100vh;
        }

        .widget {
            width: 100%;
            max-width: 336px;
            background: linear-gradient(180deg, #0e131c, #0a0e15);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .02) inset;
            display: flex;
            flex-direction: column;
        }

        .w-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            gap: 8px;
        }

        .w-loc {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .w-loc svg {
            flex: none;
            color: var(--accent);
        }

        .w-loc-text .name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .2px;
        }

        .obj-badge {
            flex: none;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .6px;
            padding: 4px 9px;
            border-radius: 20px;
            white-space: nowrap;
            background: color-mix(in srgb, var(--danger) 16%, transparent);
            color: var(--danger);
            border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
        }

        .w-body {
            padding: 12px 14px 12px;
        }

        .bracket {
            position: relative;
        }

        .bracket::before,
        .bracket::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            border: 1.4px solid var(--accent);
            opacity: .55;
            pointer-events: none;
            z-index: 2;
        }

        .bracket::before {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .bracket::after {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        /* full-bleed camera frame */
        .cam-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: #080a10;
            border: 1px solid var(--line);
            margin-bottom: 8px;
        }

        .cam-frame canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .cam-hud-l {
            position: absolute;
            top: 6px;
            left: 8px;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(25, 227, 163, .6);
        }

        .cam-hud-l .blink {
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            60% {
                opacity: 1;
            }

            80% {
                opacity: .3;
            }

            100% {
                opacity: 1;
            }
        }

        .traffic-pill {
            position: absolute;
            top: 6px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: .4px;
            color: var(--danger);
            background: rgba(8, 10, 16, .6);
            padding: 2.5px 7px;
            border-radius: 10px;
            border: 1px solid rgba(255, 84, 112, .35);
        }

        .traffic-pill .tdot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--danger);
        }

        .cam-dots {
            position: absolute;
            bottom: 7px;
            right: 9px;
            display: flex;
            gap: 5px;
            z-index: 3;
        }

        .cam-dots .cdot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            cursor: pointer;
            transition: .2s;
            border: 0;
        }

        .cam-dots .cdot.on {
            background: var(--accent);
            width: 12px;
            border-radius: 3px;
        }

        /* caption below image */
        .cam-caption {
            margin-bottom: 12px;
        }

        .cam-caption .cc-main {
            font-size: 12.5px;
            font-weight: 700;
            margin-top: 3px;
        }

        /* category grid */
        .grid-title {
            font-size: 9.5px;
            letter-spacing: 1.2px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .cat-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 9px 6px 8px;
            text-align: center;
        }

        .cat-card svg {
            color: var(--blue);
            margin-bottom: 4px;
        }

        .cat-card .cat-label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: .2px;
        }

        .cat-card .cat-num {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* footer: location + last-seen */
        .w-footer {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            padding-top: 2px;
            border-top: 1px solid var(--line);
            margin: 0 -14px;
            padding: 10px 14px 2px;
        }

        .w-footer svg {
            flex: none;
            color: var(--text-faint);
            margin-top: 1px;
        }

        .w-footer .f-name {
            font-size: 11px;
            font-weight: 600;
        }

        .w-footer .f-status {
            font-size: 9px;
            color: var(--danger);
            margin-top: 2px;
            font-family: var(--font-mono);
            letter-spacing: .2px;
        }
    </style>
</head>

<body>

                        stroke-width="1.8">

                        stroke-width="1.8">

        <div class="w-footer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </svg>
            <div>
                <div class="f-name">Gang Gotong Royong</div>
                <div class="f-status">Offline · Kamis, 02 Jul 2026 15:51:01</div>

    <script>
        /* ---------------- Camera pagination (2 scenes), auto every 10s, manual override ---------------- */
        let sceneIndex = 0;
        let camTimer = null;
        const dotsEl = document.getElementById('cam-dots');
        for (let i = 0; i < 2; i++) {
            const b = document.createElement('button');
            b.className = 'cdot' + (i === 0 ? ' on' : '');
            b.addEventListener('click', () => setScene(i));
            dotsEl.appendChild(b);
        }
        function setScene(i) {
            sceneIndex = i;
            [...dotsEl.children].forEach((d, j) => d.classList.toggle('on', j === i));
            clearTimeout(camTimer);
            scheduleCam();
        }
        function scheduleCam() {
            clearTimeout(camTimer);
            camTimer = setTimeout(() => { setScene((sceneIndex + 1) % 2); }, 10000);
        }
        scheduleCam();

        /* ---------------- Canvas: procedural scene + continuous AI scan overlay ---------------- */
        const canvas = document.getElementById('scanCanvas');
        const ctx = canvas.getContext('2d');
        const frame = canvas.closest('.cam-frame');
        function resize() { canvas.width = frame.clientWidth; canvas.height = frame.clientHeight; }
        resize();
        window.addEventListener('resize', resize);

        const COLORS = { human: { r: 25, g: 227, b: 163 }, car: { r: 77, g: 141, b: 255 } };
        const LABELS = { human: 'HUMAN', car: 'CAR' };

        function drawSceneA() {
            const W = canvas.width, H = canvas.height;
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#150a1e'); g.addColorStop(1, '#05070b');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#20142b';
            ctx.beginPath(); ctx.moveTo(W * 0.3, H * 0.5); ctx.lineTo(W * 0.7, H * 0.5); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([5, 7]); ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(W * 0.5, H * 0.52); ctx.lineTo(W * 0.5, H); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#241a30'; ctx.fillRect(0, 0, W, H * 0.5);
            ctx.fillStyle = '#2c2138';
            ctx.fillRect(W * 0.1, H * 0.68, W * 0.14, H * 0.16);
            ctx.fillRect(W * 0.62, H * 0.64, W * 0.2, H * 0.2);
        }
        function drawSceneB() {
            const W = canvas.width, H = canvas.height;
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#0e1a17'); g.addColorStop(1, '#04080a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#152420';
            ctx.beginPath(); ctx.moveTo(0, H * 0.6); ctx.lineTo(W * 0.22, H * 0.46); ctx.lineTo(W * 0.78, H * 0.46); ctx.lineTo(W, H * 0.6); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#132019';
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * 0.26, 0); ctx.lineTo(W * 0.13, H * 0.5); ctx.lineTo(0, H * 0.55); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W * 0.74, 0); ctx.lineTo(W * 0.87, H * 0.5); ctx.lineTo(W, H * 0.55); ctx.closePath(); ctx.fill();
        }

        const scanner = {
            x: 0, y: 0, vx: 1.2, vy: .9, size: 11, rot: 0, trail: [],
            lockTarget: null, lockTimer: 0, lockDur: .6, state: 'roam',
            init() { this.x = canvas.width * 0.3; this.y = canvas.height * 0.4; },
            update(dt) {
                this.rot += 0.04; this.size = 10 + Math.sin(Date.now() / 400) * 2;
                if (this.state === 'roam') {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 14 || this.x > canvas.width - 14) this.vx *= -1;
                    if (this.y < 14 || this.y > canvas.height - 14) this.vy *= -1;
                    this.x = Math.max(14, Math.min(canvas.width - 14, this.x));
                    this.y = Math.max(14, Math.min(canvas.height - 14, this.y));
                    this.trail.push({ x: this.x, y: this.y, a: .4 });
                    if (this.trail.length > 14) this.trail.shift();
                    for (const t of this.trail) t.a *= 0.88;
                } else if (this.state === 'lock') {
                    this.lockTimer += dt;
                    const prog = Math.min(this.lockTimer / this.lockDur, 1);
                    if (this.lockTarget) {
                        this.x += (this.lockTarget.cx - this.x) * 0.18;
                        this.y += (this.lockTarget.cy - this.y) * 0.18;
                    }
                    if (prog >= 1) { this.state = 'release'; this.trail = []; }
                } else if (this.state === 'release') {
                    this.x += this.vx * 1.3; this.y += this.vy * 1.3;
                    if (this.x < 14 || this.x > canvas.width - 14) this.vx *= -1;
                    if (this.y < 14 || this.y > canvas.height - 14) this.vy *= -1;
                    this.x = Math.max(14, Math.min(canvas.width - 14, this.x));
                    this.y = Math.max(14, Math.min(canvas.height - 14, this.y));
                    this.trail.push({ x: this.x, y: this.y, a: .3 });
                    if (this.trail.length > 14) this.trail.shift();
                    for (const t of this.trail) t.a *= 0.85;
                    this.lockTimer = 0; this.lockTarget = null; this.state = 'roam';
                }
            },
            lockOn(det) { this.lockTarget = det; this.lockTimer = 0; this.state = 'lock'; this.trail = []; },
            draw() {
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i]; const s = this.size * 0.5 * (i / this.trail.length);
                    ctx.save(); ctx.globalAlpha = t.a * (i / this.trail.length);
                    ctx.strokeStyle = '#19e3a3'; ctx.lineWidth = .8; ctx.translate(t.x, t.y);
                    const cl = s * .5;
                    ctx.beginPath();
                    ctx.moveTo(-s, -s + cl); ctx.lineTo(-s, -s); ctx.lineTo(-s + cl, -s);
                    ctx.moveTo(s - cl, -s); ctx.lineTo(s, -s); ctx.lineTo(s, -s + cl);
                    ctx.moveTo(s, s - cl); ctx.lineTo(s, s); ctx.lineTo(s - cl, s);
                    ctx.moveTo(-s + cl, s); ctx.lineTo(-s, s); ctx.lineTo(-s, s - cl);
                    ctx.stroke(); ctx.restore();
                }
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
                const s = this.size, cl = s * .55;
                ctx.globalAlpha = 0.15 + 0.1 * Math.sin(Date.now() / 300);
                ctx.strokeStyle = '#19e3a3'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(0, 0, s * 1.1, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 1; ctx.lineWidth = 1.6; ctx.lineCap = 'square';
                ctx.shadowColor = '#19e3a3'; ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.moveTo(-s, -s + cl); ctx.lineTo(-s, -s); ctx.lineTo(-s + cl, -s);
                ctx.moveTo(s - cl, -s); ctx.lineTo(s, -s); ctx.lineTo(s, -s + cl);
                ctx.moveTo(s, s - cl); ctx.lineTo(s, s); ctx.lineTo(s - cl, s);
                ctx.moveTo(-s + cl, s); ctx.lineTo(-s, s); ctx.lineTo(-s, s - cl);
                ctx.stroke();
                ctx.globalAlpha = .5; ctx.shadowBlur = 0; ctx.lineWidth = .8;
                const c = s * .28;
                ctx.beginPath(); ctx.moveTo(-c, 0); ctx.lineTo(c, 0); ctx.moveTo(0, -c); ctx.lineTo(0, c); ctx.stroke();
                ctx.globalAlpha = .9; ctx.fillStyle = '#19e3a3'; ctx.shadowBlur = 6; ctx.shadowColor = '#19e3a3';
                ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        };

        let detections = []; let idc = 0;
        const objBadge = document.getElementById('obj-badge');
        const objekNum = document.getElementById('objek-num');
        const ccMain = document.getElementById('cc-main');

        class Detection {
            constructor(type, x, y) {
                this.type = type; this.id = idc++;
                const sizes = { human: [24, 46], car: [54, 28] };
                const [bw, bh] = sizes[type];
                this.tw = bw + Math.random() * 10; this.th = bh + Math.random() * 8;
                this.cx = Math.max(this.tw / 2 + 8, Math.min(canvas.width - this.tw / 2 - 8, x));
                this.cy = Math.max(this.th / 2 + 16, Math.min(canvas.height - this.th / 2 - 8, y));
                this.w = 3; this.h = 3; this.phase = 'grow'; this.phaseTimer = 0;
                this.accuracy = 79 + Math.floor(Math.random() * 16);
                this.col = { ...COLORS[type] }; this.alpha = 0; this.labelAlpha = 0; this.scanY = -1;
                this.vx = (Math.random() - .5) * 0.5; this.vy = (Math.random() - .5) * 0.5; this.pulse = Math.random() * Math.PI * 2;
            }
            update(dt) {
                this.pulse += dt * 2.5;
                if (this.phase === 'grow') {
                    this.phaseTimer += dt;
                    const prog = Math.min(this.phaseTimer / 0.5, 1);
                    const e = 1 - Math.pow(1 - prog, 3);
                    this.w = 3 + (this.tw - 3) * e; this.h = 3 + (this.th - 3) * e;
                    this.alpha = prog; this.labelAlpha = prog > 0.75 ? (prog - 0.75) / 0.25 : 0;
                    this.scanY = -this.h / 2 + this.h * prog;
                    if (prog >= 1) {
                        this.phase = 'locked'; this.phaseTimer = 0;
                        ccMain.textContent = (this.type === 'car' ? 'Kendaraan' : 'Pejalan kaki') + ' ' + this.accuracy + '%';
                    }
                } else {
                    this.alpha = 1; this.labelAlpha = 1;
                    this.cx += this.vx; this.cy += this.vy;
                    if (this.cx - this.w / 2 < 6 || this.cx + this.w / 2 > canvas.width - 6) this.vx *= -1;
                    if (this.cy - this.h / 2 < 6 || this.cy + this.h / 2 > canvas.height - 6) this.vy *= -1;
                    this.cx = Math.max(this.w / 2 + 6, Math.min(canvas.width - this.w / 2 - 6, this.cx));
                    this.cy = Math.max(this.h / 2 + 6, Math.min(canvas.height - this.h / 2 - 6, this.cy));
                }
            }
            cs(a) { return `rgba(${this.col.r},${this.col.g},${this.col.b},${a})`; }
            draw() {
                const x = this.cx - this.w / 2, y = this.cy - this.h / 2, w = this.w, h = this.h;
                const cl = Math.min(w * 0.3, 12); const glow = 0.06 + 0.03 * Math.sin(this.pulse);
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.cs(glow); ctx.fillRect(x, y, w, h);
                if (this.phase === 'grow') {
                    const sy = this.cy + this.scanY;
                    ctx.fillStyle = this.cs(.55); ctx.fillRect(x, sy - 1, w, 1.5);
                    ctx.fillStyle = this.cs(.15); ctx.fillRect(x, sy - 6, w, 6);
                }
                ctx.shadowColor = this.cs(1); ctx.shadowBlur = 5;
                ctx.strokeStyle = this.cs(1); ctx.lineWidth = 1.4; ctx.lineCap = 'square';
                ctx.beginPath();
                ctx.moveTo(x, y + cl); ctx.lineTo(x, y); ctx.lineTo(x + cl, y);
                ctx.moveTo(x + w - cl, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cl);
                ctx.moveTo(x + w, y + h - cl); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - cl, y + h);
                ctx.moveTo(x + cl, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - cl);
                ctx.stroke();
                if (this.labelAlpha > 0) {
                    ctx.globalAlpha = this.alpha * this.labelAlpha; ctx.shadowBlur = 0;
                    const lbl = LABELS[this.type] + ' ' + this.accuracy + '%';
                    ctx.font = 'bold 7px "JetBrains Mono"';
                    const lw = ctx.measureText(lbl).width;
                    const lx = Math.max(2, Math.min(canvas.width - lw - 8, x));
                    const ly = Math.max(2, y - 12);
                    ctx.fillStyle = this.cs(0.9); ctx.fillRect(lx, ly, lw + 6, 11);
                    ctx.fillStyle = '#04140f'; ctx.fillText(lbl, lx + 3, ly + 8);
                }
                ctx.restore();
            }
        }
        function spawnDet(type) {
            const d = new Detection(type, 16 + Math.random() * (canvas.width - 32), 16 + Math.random() * (canvas.height - 32));
            detections.push(d); scanner.lockOn(d);
            if (detections.length > 3) detections.shift();
            objBadge.textContent = detections.length + ' OBJ';
            objekNum.textContent = detections.length;
        }
        scanner.init();
        setTimeout(() => spawnDet('car'), 700);
        setTimeout(() => spawnDet('human'), 2000);
        setInterval(() => { spawnDet(Math.random() < 0.5 ? 'human' : 'car'); }, 7000);

        let last = 0;
        function loop(ts) {
            const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
            resize();
            if (sceneIndex === 0) drawSceneA(); else drawSceneB();
            scanner.update(dt);
            for (const d of detections) d.update(dt);
            scanner.draw();
            for (const d of detections) d.draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(ts => { last = ts; requestAnimationFrame(loop); });
    </script>
</body>
